bundle: back_office
policies:
  - id: BO-REPORT-READ-RECONCILIATION
    description: Report agent may read reconciliation results.
    priority: 200
    effect: ALLOW_WITH_OBLIGATIONS
    match:
      subjects: [report_agent]
      resources: [reconciliation_results]
      actions: [read]
      workflows: [eod_processing, report_generation]
    obligations:
      - type: enhanced_logging
        parameters:
          reason: reconciliation_report_input

  - id: BO-REPORT-CREATE-FINAL-REPORT
    description: Report agent may create and store final reports.
    priority: 180
    effect: ALLOW_WITH_OBLIGATIONS
    match:
      subjects: [report_agent]
      resources: [final_report]
      actions: [create, store]
      workflows: [report_generation]
    obligations:
      - type: enhanced_logging
        parameters:
          reason: final_report_write

  - id: BO-RECONCILER-READ-LEDGER-SNAPSHOT
    description: Reconciliation agent may read a ledger snapshot.
    priority: 180
    effect: ALLOW_WITH_OBLIGATIONS
    match:
      subjects: [reconciliation_agent]
      resources: [ledger_snapshot]
      actions: [read]
      workflows: [eod_processing]
    obligations:
      - type: enhanced_logging
        parameters:
          reason: ledger_reconciliation

  - id: BO-EXCEPTION-CREATE-CASE
    description: Exception handler may create and update exception cases.
    priority: 150
    effect: ALLOW_WITH_OBLIGATIONS
    match:
      subjects: [exception_agent]
      resources: [exception_case]
      actions: [create, update]
      workflows: [eod_processing, exception_handling]
    obligations:
      - type: enhanced_logging
        parameters:
          reason: exception_case_change
