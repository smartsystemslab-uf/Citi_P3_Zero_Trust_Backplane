# Bindings for translating policy_intent.yaml (controlled natural language) into PSL
# (zt_psl.intent). Every subject, resource, field and phrase an intent rule uses must be
# bound here; anything unbound is a translation error -- nothing is guessed.
#
# Scopes are those of zero_trust_pdp_task4_secure/policy_store/policy_fields.yaml.
# Agent session state (session_state.*) is written by LLM agents and is NOT trusted:
# prerequisites are bound to trusted facts instead -- events the runtime observed itself
# (workflow_run scope) or the request's own, hash-bound arguments (pdp_request scope).
bindings_version: 1

subjects:
  "*": {}
  front_office_router:          {pdp_request: 'subject.runtime_id == "front_office_router"'}
  mid_office_router:            {pdp_request: 'subject.runtime_id == "mid_office_router"'}
  back_office_router:           {pdp_request: 'subject.runtime_id == "back_office_router"'}
  # workflow_run bindings are per admission event: a field exists only at the events that define it
  transaction_processing_agent: {pdp_request: 'subject.runtime_id == "transaction_processing_agent"',
                                 workflow_run: {tool_admitted: 'tool.agent == "transaction_processing_agent"'}}
  ledger_update_agent:          {pdp_request: 'subject.runtime_id == "ledger_update_agent"',
                                 workflow_run: {tool_admitted: 'tool.agent == "ledger_update_agent"'}}
  decision_making_agent:        {pdp_request: 'subject.runtime_id == "decision_making_agent"',
                                 workflow_run: {tool_admitted: 'tool.agent == "decision_making_agent"',
                                                agent_routed: 'route.to == "decision_making_agent"'},
                                 harness_output: ''}   # the harness checks the decision report itself
  exception_agent:              {pdp_request: 'subject.runtime_id == "exception_agent"',
                                 workflow_run: {tool_admitted: 'tool.agent == "exception_agent"'}}

# (resource, action) -> boundary per scope: the condition that recognises the operation
# (request scopes) or the controllable event that admits it (workflow_run).
resources:
  user_proxy_agent/call:        {gateway_input: 'input_received'}
  transfer_target/transfer:     {pdp_request: 'authz_request && resource.target_type == "subject"'}
  execute_transfer/call:        {pdp_request: 'authz_request && resource.runtime_id == "banking_transfer" && action == "execute"',
                                 workflow_run: 'tool_admitted && tool.name == "execute_transfer"'}
  apply_ledger_updates/call:    {pdp_request: 'authz_request && resource.runtime_id == "ledger" && action == "update"',
                                 workflow_run: 'tool_admitted && tool.name == "apply_ledger_updates"'}
  update_transaction_status/call: {pdp_request: 'authz_request && resource.runtime_id == "update_transaction_status"'}
  resolve_ledger_entry/call:    {pdp_request: 'authz_request && resource.runtime_id == "resolve_ledger_entry"',
                                 workflow_run: 'tool_admitted && tool.name == "resolve_ledger_entry"'}
  submit_manual_review/call:    {pdp_request: 'authz_request && resource.runtime_id == "submit_manual_review"',
                                 workflow_run: 'tool_admitted && tool.name == "submit_manual_review"'}
  trigger_eod_reconciliation/call: {gateway_tool: 'tool_call && tool.name == "trigger_eod_reconciliation"'}
  "*/call":                     {pdp_request: 'authz_request && resource.target_type != "subject"'}
  fo_decision_report/write:     {workflow_run: 'agent_routed && route.to == "decision_making_agent"',
                                 harness_output: 'harness_check'}
  bo_ledger_update_report/write: {workflow_run: 'tool_admitted && tool.name == "apply_ledger_updates"',
                                  pdp_request: 'authz_request && resource.runtime_id == "ledger" && action == "update"'}
  final_output/output:          {gateway_output: 'output_emitted'}

# intent field paths used in comparisons (==, !=, in) -> PSL field per scope
fields:
  identity.agent_id:    {pdp_request: subject.runtime_id}
  identity.user_role:   {gateway_input: user.role, gateway_tool: user.role}
  transfer.to_agent:    {pdp_request: resource.runtime_id}
  transfer.from_agent:  {pdp_request: subject.runtime_id}
  transfer.from_domain: {pdp_request: subject.domain}
  transfer.to_domain:   {pdp_request: resource.domain}
  args.status:          {pdp_request: args.status}

# argument checks of the grammar ('X is present and non-empty', 'len(X) >= n',
# 'X is a finite non-zero number') -> PSL field prefix per scope
checked_fields:
  args.rationale:         {pdp_request: args.rationale}
  args.note:              {pdp_request: args.note}
  args.correction_amount: {pdp_request: args.correction_amount}

# whole phrases evaluated by trusted checkers -> PSL Boolean per scope
phrases:
  "identity.session_id is present and non-empty":                 {gateway_input: 'session.id_present'}
  "input.message does not match prompt_injection_pattern_list":    {gateway_input: '!input.prompt_injection_detected'}
  "args are well-formed (no malformed JSON, no unexpected null fields)": {pdp_request: 'args.well_formed'}
  "transfer.from_domain != transfer.to_domain":                    {pdp_request: 'request.cross_domain'}
  "output does not match pattern account_id_regex":                {gateway_output: '!output.contains.account_id'}
  "output does not match pattern ssn_regex":                       {gateway_output: '!output.contains.ssn'}
  "output does not match pattern email_regex":                     {gateway_output: '!output.contains.email'}
  "output does not match pattern phone_regex":                     {gateway_output: '!output.contains.phone'}
  "output does not contain unexplained_internal_amount":           {gateway_output: '!output.contains.unexplained_internal_amount'}
  "output contains all required_text_terms for the active scenario": {harness_output: 'output.required_terms_present'}
  "output.status matches scenario_expectation.expected_status (when defined)": {harness_output: 'output.status_matches_expectation'}

# conditions that are realised by another part of the policy set (no extra PSL rule)
realized_by:
  "resource.tool_id in subject.authorized_tools": >
    R_default_deny over the least-privilege @permit properties generated for every Task 3
    placement (native_mas_runtime.psl): a tool without a placement for the caller has no
    permission and is denied.

# session_state prerequisites -> trusted facts. workflow_run: evidence event that must occur
# BEFORE the operation's admission event (PSL 'before'); pdp_request: condition on the
# request's own hash-bound arguments.
prerequisites:
  "session_state.fo_service_result is present":
    {workflow_run: 'agent_routed && route.to == "customer_service_agent"'}
  "session_state.fo_service_result.execution_required == true":
    {workflow_run: 'agent_routed && route.to == "customer_service_agent"',
     note: "the customer-service agent's decision to execute is LLM output with no trusted counterpart; the rule requires that the customer-service step ran"}
  "session_state.fo_service_result.source_account is present":      {pdp_request: 'args.source_account.nonempty'}
  "session_state.fo_service_result.destination_account is present": {pdp_request: 'args.destination_account.nonempty'}
  "session_state.fo_service_result.amount is present":              {pdp_request: 'args.amount.finite_nonzero'}
  "session_state.bo_validation_report is present":
    {workflow_run: 'tool_succeeded && tool.name == "validate_eod_readiness"'}
  "session_state.bo_validation_report.ready == true":
    {workflow_run: 'tool_succeeded && tool.name == "validate_eod_readiness" && result.ready'}
  "session_state.bo_processing_report is present":
    {workflow_run: 'tool_succeeded && tool.name == "get_eod_batch"'}
  "session_state.bo_processing_report.posting_instructions is present": {pdp_request: 'args.posting_instructions.nonempty'}
  "session_state.bo_reconciliation_report is present":
    {workflow_run: 'tool_succeeded && tool.name == "get_reconciliation_data"'}
  "session_state.fo_monitoring_report is present":
    {workflow_run: 'tool_succeeded && tool.agent == "transaction_monitoring_agent"'}
  "session_state.fo_fraud_report is present":
    {workflow_run: 'tool_succeeded && tool.agent == "fraud_detection_agent"'}
  "session_state.fo_compliance_report is present":
    {workflow_run: 'tool_succeeded && tool.agent == "compliance_agent"'}

# rules translated but not enabled, with the reason (reported, never silently dropped)
disabled:
  no-cross-domain-transfers: >
    Enabling it would deny 13 legitimate routes of the real MAS: the Task 2 scanner assigns the
    mid-office workflow agents (mid_office_planning_workflow, mid_office_planning_parallel,
    representative_assistant_workflow, representative_assist_parallel) to domain 'shared'
    instead of 'mid_office'. Fix the domain data (or the rule), then remove this entry.
    Evidence: zt_psl intent consistency check against generated_pep_plan.json.
