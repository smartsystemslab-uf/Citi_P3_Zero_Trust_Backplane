[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-distributed"
version = "0.1.0"
description = "Distributed runtime of the Zero Trust Backplane for any ADK application: one container per agent, SPIFFE scheme B identities, gateway PEP with MCP tool host, signed PSL policies"
requires-python = ">=3.11"
dependencies = [
  "zt-adk>=0.1.0",
  "zt-identity>=0.1.0",
  "zt-pdp>=1.0.0",
  "zt-psl>=0.1.0",
  "mcp>=1.30,<3",
  "aiohttp>=3.9,<4",
  "spiffe>=0.3.1,<0.5",
  "http-sfv>=0.9",
  "http-message-signatures>=2.0.1,<3",
  "httpcore>=1.0,<2",
  "httpx>=0.27,<1",
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zt-distributed = "zt_distributed.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
