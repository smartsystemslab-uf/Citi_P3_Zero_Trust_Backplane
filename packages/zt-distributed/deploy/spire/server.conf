server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "__TRUST_DOMAIN__"
    data_dir = "/var/lib/spire/server"
    log_level = "INFO"
    ca_key_type = "ec-p256"
    # Workload CA lifetime; SVIDs cannot outlive it.
    ca_ttl = "168h"
    # Steady-state SVID lifetime (long enough that no rotation happens during a
    # benchmark block). The rotation experiment sets short per-entry TTLs.
    default_x509_svid_ttl = "24h"
    ca_subject {
        country = ["US"]
        organization = ["zt-adk workload CA (development deployment)"]
        common_name = ""
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/etc/spire/node_ca.pem"
            agent_path_template = "/x509pop/{{ .Subject.CommonName }}"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
