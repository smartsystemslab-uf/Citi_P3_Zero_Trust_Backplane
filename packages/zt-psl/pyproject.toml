[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-psl"
version = "0.1.0"
description = "PSL (IEEE 1850) policy language for the Zero Trust Backplane: parser, compiler, monitors, deny-overrides decisions, signed policy files"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "cryptography>=41",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zt-psl = "zt_psl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
