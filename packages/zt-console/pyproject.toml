[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-console"
version = "0.1.0"
description = "Web console for the Zero Trust Backplane: set up a protected application, run and test it from the browser, and inspect every decision"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1.0"]

[project.scripts]
zt-console = "zt_console.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zt_console = ["static/*", "seed/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
