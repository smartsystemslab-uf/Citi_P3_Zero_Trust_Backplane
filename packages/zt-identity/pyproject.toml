[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-identity"
version = "0.1.0"
description = "SPIFFE scheme B for the Zero Trust Backplane: X.509-SVID workload identity (mTLS) + agent credential (agent certificate, RFC 9421 signatures, registry, replay window)"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
  "aiohttp>=3.9",
  "spiffe>=0.3.1,<0.5",
  "http-sfv>=0.9",
  "http-message-signatures>=2.0.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
