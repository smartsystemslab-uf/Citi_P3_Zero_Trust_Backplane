[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-scanner"
version = "1.0.0"
description = "Static Zero Trust scanner for multi-agent systems: draft ZT-IR manifests, inventories and the interaction graph from source"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zt-scan = "zt_scanner.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
