[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-adk"
version = "0.1.0"
description = "Zero Trust Backplane for any Google ADK multi-agent system: discovery, generated PEPs and signed PSL policies, in-process ADK plugin, approvals, distributed SPIFFE runtime support"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.18",
  "PyYAML>=6.0,<7.0",
  "cryptography>=43,<48",
  "jsonschema>=4.23,<5.0",
  "pydantic>=2.8,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "zero-trust-backplane-interface>=1.1.0a1",
  "zero-trust-pep-task3-integrated>=1.0.0",
  "zero-trust-pdp-task4-secure>=1.0.0",
  "zero-trust-task5>=0.1.0",
  "zero-trust-psl>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zt-adk = "zt_adk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zt_adk = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
