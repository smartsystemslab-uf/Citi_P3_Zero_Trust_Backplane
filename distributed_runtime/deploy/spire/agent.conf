agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "__TRUST_DOMAIN__"
    # Exported from the running server by the start script (`spire-server bundle show`).
    trust_bundle_path = "/etc/spire/bootstrap_bundle.pem"
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/run/secrets/spire-node/node.key"
            certificate_path = "/run/secrets/spire-node/node.pem"
        }
    }
    KeyManager "memory" {
        plugin_data {}
    }
    # Workload attestation by trusted deployment attributes: the container's
    # Docker labels (set only by the compose deployment) ...
    WorkloadAttestor "docker" {
        plugin_data {}
    }
    # ... and the (distinct per workload) Unix UID of the calling process.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
