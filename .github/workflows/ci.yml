# Host test suites of the Zero Trust Backplane. The Docker end-to-end tests
# (packages/zt-distributed/tests/functional) and the Citi P3 regression (needs a copy of the Citi app,
# CITI_MAS_COPY) skip themselves here; run them locally (README, Tests).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        adk: ["google-adk>=2,<3", "google-adk==1.31.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            -e packages/zt-interface -e packages/zt-scanner -e packages/zt-pep -e packages/zt-pdp \
            -e packages/zt-lease -e packages/zt-psl -e packages/zt-identity \
            -e "packages/zt-adk[test]" -e packages/zt-distributed \
            "${{ matrix.adk }}"
          python -c "import google.adk; print('google-adk', google.adk.__version__)"
      - name: Policy store and configuration
        shell: bash
        run: |
          python packages/zt-pdp/scripts/sign_psl_policies.py --check
          python packages/zt-pdp/scripts/validate_configuration.py
      - name: Tests
        # One pytest process per suite: several suites are packages named "tests" with their own
        # conftest.py, which collide (ImportPathMismatchError) when collected in one process.
        shell: bash
        run: |
          set -e
          for suite in \
            packages/zt-adk/tests packages/zt-distributed/tests/unit \
            packages/zt-psl/tests packages/zt-pdp/tests packages/zt-lease/tests packages/zt-pep/tests \
            packages/zt-interface/tests packages/zt-scanner/tests packages/zt-identity/tests \
            legacy/citi_p3/native_runtime/tests legacy/citi_p3/integrated_demo/tests
          do
            echo "::group::$suite"
            python -m pytest -p no:cacheprovider -q "$suite"
            echo "::endgroup::"
          done
