# Zero Trust profile of the claims desk (an ADK 2.x graph workflow), with the scripted playback
# model (playback.yaml): reproducible tests and keyless demos, in-process and distributed.
version: 1
app: "claims.agent:app"
python_paths: ["."]
source_root: "."
environment: test
mode: enforce

tools:
  claims_desk/pay_claim: {criticality: critical, requires_approval: true, allowed_roles: [adjuster, claims_officer]}

approvals:
  critical: single
  wait_seconds: 60

session:
  roles: [customer, adjuster, claims_officer]

identity:
  trust_domain: claims.zt-adk.test

model_override: {type: playback, script: playback.yaml}

distributed:
  requirements: [requirements.txt]
  app_paths: [claims, playback.yaml, requirements.txt, zt_adk.yaml]
